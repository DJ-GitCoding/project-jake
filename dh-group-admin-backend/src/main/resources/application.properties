server.port=8083
server.servlet.context-path=/dh-group-admin

# Mutual TLS between backend services (see scripts/generate-mtls-certs.sh).
# Disabled by default so a lone service can run without the cert chain (local dev).
mtls.enabled=${MTLS_ENABLED:false}
mtls.port=${MTLS_PORT:8483}
mtls.key-store=${MTLS_KEY_STORE:}
mtls.key-store-password=${MTLS_KEY_STORE_PASSWORD:}
mtls.trust-store=${MTLS_TRUST_STORE:}
mtls.trust-store-password=${MTLS_TRUST_STORE_PASSWORD:}
mtls.port-map=${MTLS_PORT_MAP:8081:8481,8082:8482,8083:8483}

# Error responses must not leak backend internals to clients
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dhgroupadmin_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Keycloak
keycloak.introspect-url=${KEYCLOAK_INTROSPECT_URL:http://keycloak:8080/realms/master/protocol/openid-connect/token/introspect}
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://keycloak:8080/realms/master/protocol/openid-connect/token}
keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://keycloak:8080/admin/realms/master}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:jaddar-client}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3003}

# Logging
logging.level.com.jaddar.dhgroupadmin=DEBUG
logging.level.org.springframework.web=INFO

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Provisioning sidecar
provisioner.url=${PROVISIONER_URL:http://provisioning-sidecar:9500}
provisioner.secret=${DHG_PROVISIONER_SECRET}

# Default admin user (only used on first run when DB is empty)
admin.default-email=${DHG_ADMIN_DEFAULT_EMAIL:}
admin.default-password=${DHG_ADMIN_DEFAULT_PASSWORD:}

# JWT
dhg.jwt.secret=${DHG_JWT_SECRET}
dhg.jwt.expiration-ms=28800000
dhg.jwt.refresh-expiration-ms=604800000

# Rate Limiting
rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
rate-limit.login-attempts-per-minute=${RATE_LIMIT_LOGIN_RPM:10}

# SendGrid (Twilio) email — password recovery
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
sendgrid.from-name=${SENDGRID_FROM_NAME:Data Holder Group Admin}

# Frontend base URL used to build password reset links
app.frontend-url=${DHG_ADMIN_FRONTEND_URL:http://localhost:3003}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:60}

# Subscription testing — how long to wait for the data holder to run its RDAP retrieval suite
subscription.test.data-holder-timeout-seconds=${SUBSCRIPTION_TEST_DH_TIMEOUT_SECONDS:15}