version: '3.8'
services:
  # Keycloak - Production-ready OpenID Connect provider
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - JADDAR_CLIENT_ID=${JADDAR_CLIENT_ID}
      - JADDAR_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - KC_HTTP_ENABLED=true
      - KC_HTTPS_CERTIFICATE_FILE=/certs/keycloak.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/certs/keycloak.key
      - KC_HOSTNAME=${KC_HOSTNAME_URL:-http://localhost:8080}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
      # Database configuration for persistence
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db?sslmode=verify-ca&sslrootcert=/certs/infra-ca.crt
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      # Logging configuration
      - KC_LOG_LEVEL=INFO,org.keycloak.events:DEBUG
      - KC_LOG_CONSOLE_OUTPUT=json
      - QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_EVENTS__LEVEL=DEBUG
      - QUARKUS_LOG_CATEGORY__ORG_KEYCLOAK_PROTOCOL_OIDC__LEVEL=DEBUG
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    command: start-dev
    volumes:
      - ./certs:/certs:ro
    networks:
      - app-network

  # Keycloak Setup - Creates client, events, group mapper, and Jaddar roles
  keycloak-setup:
    image: alpine:latest
    container_name: keycloak-setup
    depends_on:
      - keycloak
    networks:
      - app-network
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - JADDAR_CLIENT_ID=${JADDAR_CLIENT_ID}
      - JADDAR_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - JADDAR_REDIRECT_URI=${JADDAR_REDIRECT_URI}
      - JADDAR_WEB_ORIGIN=${JADDAR_WEB_ORIGIN:-http://localhost:3000}
      - KEYCLOAK_SSO_IDLE_SECONDS=${KEYCLOAK_SSO_IDLE_SECONDS:-900}
      - KEYCLOAK_SSO_MAX_SECONDS=${KEYCLOAK_SSO_MAX_SECONDS:-36000}
      - KEYCLOAK_ACCESS_TOKEN_SECONDS=${KEYCLOAK_ACCESS_TOKEN_SECONDS:-300}
    command: |
      sh -c '
      apk add --no-cache curl jq &&
      echo "Waiting for Keycloak to start..." &&
      while ! curl -f http://keycloak:8080/realms/master >/dev/null 2>&1; do
        echo "Waiting for Keycloak..."
        sleep 5
      done &&
      echo "Keycloak is responding, waiting 10 more seconds..." &&
      sleep 10 &&
      get_token() {
        TOKEN=$$(curl -s -X POST http://keycloak:8080/realms/master/protocol/openid-connect/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "client_id=admin-cli" \
          -d "username=$$KEYCLOAK_ADMIN" \
          -d "password=$$KEYCLOAK_ADMIN_PASSWORD" \
          -d "grant_type=password" | jq -r .access_token)
      } &&
      echo "Getting admin token..." && get_token &&

      echo "===== CONFIGURING SESSION TIMEOUTS =====" &&
      REALM_CONFIG=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master" \
        -H "Authorization: Bearer $$TOKEN" \
        -H "Content-Type: application/json") &&
      
      CURRENT_SSO_IDLE=$$(echo "$$REALM_CONFIG" | jq -r ".ssoSessionIdleTimeout") &&
      CURRENT_ACCESS_LIFESPAN=$$(echo "$$REALM_CONFIG" | jq -r ".accessTokenLifespan") &&
      echo "Current SSO Session Idle Timeout: $$CURRENT_SSO_IDLE seconds" &&
      echo "Current Access Token Lifespan: $$CURRENT_ACCESS_LIFESPAN seconds" &&
      echo "Desired: idle=$$KEYCLOAK_SSO_IDLE_SECONDS access=$$KEYCLOAK_ACCESS_TOKEN_SECONDS" &&
      
      # This used to be guarded on ssoSessionIdleTimeout alone. The master realm ships
      # with ssoSessionIdleTimeout=1800 already, so the old "!= 1800" test was never
      # true on a fresh Keycloak and the PUT never ran -- leaving accessTokenLifespan at
      # the master-realm default of 60s. Compare every value we care about instead.
      if [ "$$CURRENT_SSO_IDLE" != "$$KEYCLOAK_SSO_IDLE_SECONDS" ] || \
         [ "$$CURRENT_ACCESS_LIFESPAN" != "$$KEYCLOAK_ACCESS_TOKEN_SECONDS" ]; then
        echo "Updating realm session timeouts..." &&
        curl -s -X PUT "http://keycloak:8080/admin/realms/master" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"ssoSessionIdleTimeout\": $$KEYCLOAK_SSO_IDLE_SECONDS,
            \"ssoSessionMaxLifespan\": $$KEYCLOAK_SSO_MAX_SECONDS,
            \"accessTokenLifespan\": $$KEYCLOAK_ACCESS_TOKEN_SECONDS,
            \"accessTokenLifespanForImplicitFlow\": $$KEYCLOAK_ACCESS_TOKEN_SECONDS,
            \"offlineSessionIdleTimeout\": 2592000,
            \"offlineSessionMaxLifespan\": 5184000
          }" &&
        VERIFY=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master" \
          -H "Authorization: Bearer $$TOKEN") &&
        echo "Applied: idle=$$(echo "$$VERIFY" | jq -r .ssoSessionIdleTimeout)s access=$$(echo "$$VERIFY" | jq -r .accessTokenLifespan)s" &&
        echo "Session timeouts updated successfully!"
      else
        echo "Session timeouts already correct, skipping."
      fi &&
      
      echo "===== ENABLING KEYCLOAK EVENTS =====" &&
      curl -s -X PUT "http://keycloak:8080/admin/realms/master/events/config" \
        -H "Authorization: Bearer $$TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"eventsEnabled\": true,
          \"eventsExpiration\": 604800,
          \"eventsListeners\": [\"jboss-logging\"],
          \"enabledEventTypes\": [
            \"LOGIN\", \"LOGIN_ERROR\", \"LOGOUT\", \"LOGOUT_ERROR\",
            \"CODE_TO_TOKEN\", \"CODE_TO_TOKEN_ERROR\",
            \"REFRESH_TOKEN\", \"REFRESH_TOKEN_ERROR\",
            \"INTROSPECT_TOKEN\", \"INTROSPECT_TOKEN_ERROR\"
          ],
          \"adminEventsEnabled\": true,
          \"adminEventsDetailsEnabled\": true
        }" &&
      echo "Events enabled successfully!" &&
      
      echo "===== SETTING UP CLIENT =====" &&
      EXISTING_CLIENT=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/clients?clientId=$$JADDAR_CLIENT_ID" \
        -H "Authorization: Bearer $$TOKEN" \
        -H "Content-Type: application/json") &&
      if [ "$$EXISTING_CLIENT" = "[]" ]; then
        echo "Creating new client..." &&
        curl -s -X POST http://keycloak:8080/admin/realms/master/clients \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"clientId\": \"$$JADDAR_CLIENT_ID\",
            \"enabled\": true,
            \"clientAuthenticatorType\": \"client-secret\",
            \"secret\": \"$$JADDAR_CLIENT_SECRET\",
            \"redirectUris\": [\"*\"],
            \"webOrigins\": [\"*\"],
            \"publicClient\": false,
            \"protocol\": \"openid-connect\",
            \"standardFlowEnabled\": true,
            \"directAccessGrantsEnabled\": true
          }" &&
        echo "Client created successfully!"
      else
        echo "Client $$JADDAR_CLIENT_ID already exists, updating..." &&
        CLIENT_UUID=$$(echo $$EXISTING_CLIENT | jq -r ".[0].id") &&
        curl -s -X PUT "http://keycloak:8080/admin/realms/master/clients/$$CLIENT_UUID" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"clientId\": \"$$JADDAR_CLIENT_ID\",
            \"enabled\": true,
            \"clientAuthenticatorType\": \"client-secret\",
            \"secret\": \"$$JADDAR_CLIENT_SECRET\",
            \"redirectUris\": [\"*\"],
            \"webOrigins\": [\"*\"],
            \"publicClient\": false,
            \"protocol\": \"openid-connect\",
            \"standardFlowEnabled\": true,
            \"directAccessGrantsEnabled\": true
          }" &&
        echo "Client updated successfully!"
      fi &&
      
      echo "===== SETTING UP GROUP MEMBERSHIP MAPPER =====" &&
      CLIENT_UUID=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/clients?clientId=$$JADDAR_CLIENT_ID" \
        -H "Authorization: Bearer $$TOKEN" | jq -r ".[0].id") &&
      
      GROUPS_SCOPE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/client-scopes" \
        -H "Authorization: Bearer $$TOKEN" | jq -r ".[] | select(.name==\"groups\") | .id") &&
      
      if [ -z "$$GROUPS_SCOPE" ]; then
        echo "Creating groups client scope..." &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/client-scopes" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"groups\",
            \"protocol\": \"openid-connect\",
            \"attributes\": {
              \"include.in.token.scope\": \"true\",
              \"display.on.consent.screen\": \"false\"
            }
          }" &&
        GROUPS_SCOPE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/client-scopes" \
          -H "Authorization: Bearer $$TOKEN" | jq -r ".[] | select(.name==\"groups\") | .id")
      fi &&
      
      EXISTING_MAPPER=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/client-scopes/$$GROUPS_SCOPE/protocol-mappers/models" \
        -H "Authorization: Bearer $$TOKEN" | jq -r ".[] | select(.name==\"groups\")") &&
      
      if [ -z "$$EXISTING_MAPPER" ]; then
        echo "Creating groups mapper..." &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/client-scopes/$$GROUPS_SCOPE/protocol-mappers/models" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"groups\",
            \"protocol\": \"openid-connect\",
            \"protocolMapper\": \"oidc-group-membership-mapper\",
            \"config\": {
              \"full.path\": \"false\",
              \"id.token.claim\": \"true\",
              \"access.token.claim\": \"true\",
              \"claim.name\": \"groups\",
              \"userinfo.token.claim\": \"true\"
            }
          }"
      fi &&
      
      curl -s -X PUT "http://keycloak:8080/admin/realms/master/clients/$$CLIENT_UUID/default-client-scopes/$$GROUPS_SCOPE" \
        -H "Authorization: Bearer $$TOKEN" &&
      echo "Groups scope configured!" &&
      
      echo "===== SETTING UP JADDAR ROLES =====" &&
      
      # Create jaddar_master_admin role (Level 1 - Highest)
      EXISTING_ROLE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles/jaddar_master_admin" \
        -H "Authorization: Bearer $$TOKEN" 2>/dev/null) &&
      if echo "$$EXISTING_ROLE" | grep -q "error\|Could not find"; then
        echo "Creating role: jaddar_master_admin" &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/roles" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\": \"jaddar_master_admin\", \"description\": \"Level 1: Full system access - Jaddar, Requestor Manager, and Keycloak admin\"}"
      else
        echo "Role jaddar_master_admin already exists"
      fi &&
      
      # Create group_admin role (Level 2)
      EXISTING_ROLE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles/group_admin" \
        -H "Authorization: Bearer $$TOKEN" 2>/dev/null) &&
      if echo "$$EXISTING_ROLE" | grep -q "error\|Could not find"; then
        echo "Creating role: group_admin" &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/roles" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\": \"group_admin\", \"description\": \"Level 2: Can create and manage requestor groups, designate requestor_group_admin\"}"
      else
        echo "Role group_admin already exists"
      fi &&
      
      # Create requestor_group_admin role (Level 3)
      EXISTING_ROLE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles/requestor_group_admin" \
        -H "Authorization: Bearer $$TOKEN" 2>/dev/null) &&
      if echo "$$EXISTING_ROLE" | grep -q "error\|Could not find"; then
        echo "Creating role: requestor_group_admin" &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/roles" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\": \"requestor_group_admin\", \"description\": \"Level 3: Can create requestors and agreements within assigned groups\"}"
      else
        echo "Role requestor_group_admin already exists"
      fi &&
      
      # Create requestor_group_user role (Level 4 - Lowest)
      EXISTING_ROLE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles/requestor_group_user" \
        -H "Authorization: Bearer $$TOKEN" 2>/dev/null) &&
      if echo "$$EXISTING_ROLE" | grep -q "error\|Could not find"; then
        echo "Creating role: requestor_group_user" &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/roles" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\": \"requestor_group_user\", \"description\": \"Level 4: Can view/use agreement data and make RDAP requests\"}"
      else
        echo "Role requestor_group_user already exists"
      fi &&
      
      echo "===== REMOVING OLD ROLES (if exist) =====" &&
      for OLD_ROLE in agreement_master agreement_admin; do
        curl -s -X DELETE "http://keycloak:8080/admin/realms/master/roles/$$OLD_ROLE" \
          -H "Authorization: Bearer $$TOKEN" 2>/dev/null || true
      done &&
      echo "Old roles cleanup complete" &&
      
      echo "===== ASSIGNING JADDAR_MASTER_ADMIN TO ADMIN USER =====" &&
      ADMIN_USER=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/users?username=$$KEYCLOAK_ADMIN" \
        -H "Authorization: Bearer $$TOKEN" \
        -H "Content-Type: application/json") &&
      ADMIN_USER_ID=$$(echo $$ADMIN_USER | jq -r ".[0].id") &&
      
      if [ "$$ADMIN_USER_ID" != "null" ] && [ -n "$$ADMIN_USER_ID" ]; then
        echo "Admin user ID: $$ADMIN_USER_ID" &&
        MASTER_ROLE=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles/jaddar_master_admin" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json") &&
        curl -s -X POST "http://keycloak:8080/admin/realms/master/users/$$ADMIN_USER_ID/role-mappings/realm" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "[$$MASTER_ROLE]" &&
        echo "Assigned jaddar_master_admin role to admin user"
      fi &&
      
      echo "===== LISTING ALL REALM ROLES =====" &&
      ALL_ROLES=$$(curl -s -X GET "http://keycloak:8080/admin/realms/master/roles" \
        -H "Authorization: Bearer $$TOKEN") &&
      echo "Available roles:" &&
      echo "$$ALL_ROLES" | jq -r ".[].name" &&
      
      echo "===== SETUP COMPLETE ====="
      '
  
  # Jaddar main backend
  jaddar-backend:
    image: jaddar-backend:latest
    build:
      context: ./jaddar-backend
      dockerfile: Dockerfile.dev
    container_name: jaddar-backend
    ports:
      - "${JADDAR_BACKEND_PORT:-8000}:8000"
    environment:
      # Sensitive admin/token/refresh hop -> encrypted https:8443 (keycloakWebClient trusts the dev CA).
      - JADDAR_KEYCLOAK_AUTH_URL=${JADDAR_KEYCLOAK_AUTH_URL:-https://keycloak:8443/realms/master}
      # Public-key JWKS fetch stays on plain http (leaks nothing; Nimbus decoder trusts only cacerts).
      - JADDAR_JWKS_URL=${JADDAR_JWKS_URL:-http://keycloak:8080/realms/master}
      - JADDAR_PUBLIC_AUTH_URL=${JADDAR_PUBLIC_AUTH_URL:-http://localhost:8080/realms/master}
      - JADDAR_CLIENT_ID=${JADDAR_CLIENT_ID}
      - JADDAR_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - JADDAR_REDIRECT_URI=${JADDAR_REDIRECT_URI}
      - JADDAR_WEB_ORIGIN=${JADDAR_WEB_ORIGIN:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@admin.com}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-240}
      # Spring datasource (replaces the python DATABASE_URL) — TLS-verified to the CA
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=verify-ca&sslrootcert=/certs/infra-ca.crt
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JADDAR_REQUESTOR_AGENT_ID=${JADDAR_REQUESTOR_AGENT_ID:-JADDAR-001}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Requestor Manager connection
      - REQUESTOR_MANAGER_SERVER_URL=http://requestor-manager-backend:8081
      # Test Dataholder Server connection
      - DATAHOLDER_URL=http://dataholder-backend:8082
      # Data Holder Group Admin connection
      - DH_GROUP_ADMIN_URL=http://dh-group-admin-backend:8083
      # Password recovery (Twilio SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Jaddar}
      - JADDAR_FRONTEND_URL=${JADDAR_FRONTEND_URL:-http://localhost:3000}
      - PASSWORD_RESET_EXPIRY_MINUTES=${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      # Spring DevTools — hot reload when target/classes is recompiled
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Mutual TLS — jaddar is client-only; peer URLs above (http) are rewritten onto the peers' mTLS listeners at runtime.
      - MTLS_ENABLED=${MTLS_ENABLED:-true}
      - MTLS_KEY_STORE=/certs/jaddar-backend.p12
      - MTLS_KEY_STORE_PASSWORD=${MTLS_KEYSTORE_PASSWORD:-changeit}
      - MTLS_TRUST_STORE=/certs/jaddar-truststore.p12
      - MTLS_TRUST_STORE_PASSWORD=${MTLS_TRUSTSTORE_PASSWORD:-changeit}
    volumes:
      - ./jaddar-backend/src:/app/src
      - ./jaddar-backend/pom.xml:/app/pom.xml:ro
      - jaddar-target:/app/target
      - ./certs:/certs:ro
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
      postgres-setup:
        condition: service_completed_successfully
      requestor-manager-backend:
        condition: service_started
    networks:
      - app-network

  # Requestor Manager Backend Server (Java/Spring Boot)
  requestor-manager-backend:
    image: requestor-manager-backend:latest
    build:
      context: ./requestor-manager-backend
      dockerfile: Dockerfile.dev
    container_name: requestor-manager-backend
    ports:
      - "${REQUESTOR_MANAGER_SERVER_PORT:-8081}:8081"
      - "8481:8481"  # mTLS listener (inter-service)
      - "5005:5005"  # Remote debug port
    environment:
      # Database — TLS-verified to the CA
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agreement_db?sslmode=verify-ca&sslrootcert=/certs/infra-ca.crt
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Keycloak integration (shared with Jaddar)
      - KEYCLOAK_INTROSPECT_URL=https://keycloak:8443/realms/master/protocol/openid-connect/token/introspect
      - KEYCLOAK_TOKEN_URL=https://keycloak:8443/realms/master/protocol/openid-connect/token
      - KEYCLOAK_ADMIN_URL=https://keycloak:8443/admin/realms/master
      - KEYCLOAK_CLIENT_ID=${JADDAR_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      # Admin credentials for user management
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Spring DevTools settings
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Context path - all endpoints will be under /agreements
      - SERVER_SERVLET_CONTEXT_PATH=/agreements
      # Password recovery (Twilio SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Requestor Manager}
      - REQUESTOR_MANAGER_FRONTEND_URL=${REQUESTOR_MANAGER_FRONTEND_URL:-http://localhost:3002}
      - PASSWORD_RESET_EXPIRY_MINUTES=${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      # Mutual TLS listener for inter-service calls (jaddar, DH callback)
      - MTLS_ENABLED=${MTLS_ENABLED:-true}
      - MTLS_PORT=8481
      - MTLS_KEY_STORE=/certs/requestor-manager-backend.p12
      - MTLS_KEY_STORE_PASSWORD=${MTLS_KEYSTORE_PASSWORD:-changeit}
      - MTLS_TRUST_STORE=/certs/requestor-manager-truststore.p12
      - MTLS_TRUST_STORE_PASSWORD=${MTLS_TRUSTSTORE_PASSWORD:-changeit}
    volumes:
      - ./requestor-manager-backend/src:/app/src
      - ./requestor-manager-backend/pom.xml:/app/pom.xml
      - requestor-manager-maven-cache:/root/.m2
      - ./certs:/certs:ro
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      keycloak-setup:
        condition: service_completed_successfully
    networks:
      - app-network

  # Requestor Manager Frontend
  requestor-manager-frontend:
    image: requestor-manager-frontend:latest
    build:
      context: ./requestor-manager-frontend
      dockerfile: Dockerfile.dev
    container_name: requestor-manager-frontend
    ports:
      - "3002:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-change-me-please-32chars}
      - SESSION_IDLE_MINUTES=${SESSION_IDLE_MINUTES:-15}
      - SESSION_WARN_SECONDS=${SESSION_WARN_SECONDS:-120}
      - SESSION_MAX_HOURS=${SESSION_MAX_HOURS:-8}
      - SESSION_DB_HOST=postgres
      - SESSION_DB_PORT=5432
      - SESSION_DB_NAME=sessions_db
      - SESSION_DB_USER=${POSTGRES_USER}
      - SESSION_DB_PASSWORD=${POSTGRES_PASSWORD}
      - SESSION_DATABASE_CA=/certs/infra-ca.crt
      - SOURCE_CODE_URL=${SOURCE_CODE_URL:-}
      - BACKEND_API_URL=http://requestor-manager-backend:8081/agreements
      - NODE_ENV=development
      - REACT_APP_VERSION=1.0.8
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./certs:/certs:ro
      - ./requestor-manager-frontend:/app
      - /app/node_modules
    depends_on:
      requestor-manager-backend:
        condition: service_started
      postgres-setup:
        condition: service_completed_successfully
    networks:
      - app-network
    stdin_open: true
    tty: true

  # Data Holder Group Admin Backend (Java/Spring Boot)
  dh-group-admin-backend:
    image: dh-group-admin-backend:latest
    build:
      context: ./dh-group-admin-backend
      dockerfile: Dockerfile.dev
    container_name: dh-group-admin-backend
    ports:
      - "${DH_GROUP_ADMIN_PORT:-8083}:8083"
      - "8483:8483"  # mTLS listener (inter-service)
      - "5006:5006"  # Remote debug port
    environment:
      # Database — TLS-verified to the CA
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dhgroupadmin_db?sslmode=verify-ca&sslrootcert=/certs/infra-ca.crt
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Keycloak integration (shared with Jaddar)
      - KEYCLOAK_INTROSPECT_URL=https://keycloak:8443/realms/master/protocol/openid-connect/token/introspect
      - KEYCLOAK_TOKEN_URL=https://keycloak:8443/realms/master/protocol/openid-connect/token
      - KEYCLOAK_ADMIN_URL=https://keycloak:8443/admin/realms/master
      - KEYCLOAK_CLIENT_ID=${JADDAR_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - DHG_JWT_SECRET=${DHG_JWT_SECRET:?DHG_JWT_SECRET must be set}
      # CORS
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3003
      # Spring DevTools
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Provisioning sidecar (reached over mTLS; the sidecar requires a client cert)
      - PROVISIONER_URL=${PROVISIONER_URL:-https://provisioning-sidecar:9500}
      - DHG_PROVISIONER_SECRET=${DHG_PROVISIONER_SECRET:?DHG_PROVISIONER_SECRET must be set}
      # Default admin (first-run only)
      - DHG_ADMIN_DEFAULT_EMAIL=${DHG_ADMIN_DEFAULT_EMAIL}
      - DHG_ADMIN_DEFAULT_PASSWORD=${DHG_ADMIN_DEFAULT_PASSWORD:-}
      # Password recovery (Twilio SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Holder Group Admin}
      - DHG_ADMIN_FRONTEND_URL=${DHG_ADMIN_FRONTEND_URL:-http://localhost:3003}
      - PASSWORD_RESET_EXPIRY_MINUTES=${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      # Mutual TLS listener for inter-service calls (RM, DH); presents client cert to the sidecar
      - MTLS_ENABLED=${MTLS_ENABLED:-true}
      - MTLS_PORT=8483
      - MTLS_KEY_STORE=/certs/dh-group-admin-backend.p12
      - MTLS_KEY_STORE_PASSWORD=${MTLS_KEYSTORE_PASSWORD:-changeit}
      - MTLS_TRUST_STORE=/certs/dh-group-admin-truststore.p12
      - MTLS_TRUST_STORE_PASSWORD=${MTLS_TRUSTSTORE_PASSWORD:-changeit}
    volumes:
      - ./dh-group-admin-backend/src:/app/src
      - ./dh-group-admin-backend/pom.xml:/app/pom.xml:ro
      - dh-group-admin-target:/app/target
      - dh-group-admin-maven-cache:/root/.m2
      - ./certs:/certs:ro
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      keycloak-setup:
        condition: service_completed_successfully
    networks:
      - app-network

  # Data Holder Group Admin Frontend (React)
  dh-group-admin-frontend:
    image: dh-group-admin-frontend:latest
    build:
      context: ./dh-group-admin-frontend
      dockerfile: Dockerfile.dev
    container_name: dh-group-admin-frontend
    ports:
      - "3003:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-change-me-please-32chars}
      - SOURCE_CODE_URL=${SOURCE_CODE_URL:-}
      - BACKEND_API_URL=http://dh-group-admin-backend:8083/dh-group-admin
      - NODE_ENV=development
      - REACT_APP_VERSION=1.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./dh-group-admin-frontend:/app
      - /app/node_modules
    depends_on:
      - dh-group-admin-backend
    networks:
      - app-network
    stdin_open: true
    tty: true
  
  # Provisioning Sidecar — manages DH instance lifecycle
  provisioning-sidecar:
    image: provisioning-sidecar:latest
    build:
      context: ./provisioning-sidecar
      dockerfile: Dockerfile
    container_name: provisioning-sidecar
    ports:
      - "127.0.0.1:9500:9500"
    environment:
      - DHG_PROVISIONER_SECRET=${DHG_PROVISIONER_SECRET:?DHG_PROVISIONER_SECRET must be set}
      - DHG_PARENT_DOMAIN=${DHG_PARENT_DOMAIN:-localhost}
      - DOCKER_NETWORK=${COMPOSE_PROJECT_NAME:-icann}_app-network
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # TLS-verified connection to Postgres
      - DB_SSLMODE=verify-ca
      - DB_SSLROOTCERT=/certs/infra-ca.crt
      # Passed to spawned DH instances for their token-introspection hop (the live knob).
      - KEYCLOAK_AUTH_SERVER_URL=https://keycloak:8443
      - KEYCLOAK_INTROSPECT_URL=http://keycloak:8080/realms/master/protocol/openid-connect/token/introspect
      - KEYCLOAK_CLIENT_ID=${JADDAR_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - DH_GROUP_ADMIN_URL=http://dh-group-admin-backend:8083/dh-group-admin
      - DH_BACKEND_IMAGE=dataholder-backend:latest
      - DH_FRONTEND_IMAGE=dataholder-frontend:latest
      # Mutual TLS — the whole sidecar port flips to client-auth TLS when enabled
      - MTLS_ENABLED=${MTLS_ENABLED:-true}
      - MTLS_CERT_FILE=/certs/provisioning-sidecar.crt
      - MTLS_KEY_FILE=/certs/provisioning-sidecar.key
      - MTLS_CA_FILE=/certs/provisioning-sidecar-truststore.crt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/nginx/conf.d:/host-nginx-conf
      - /etc/letsencrypt:/host-letsencrypt
      - ./certs:/certs:ro
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    networks:
      - app-network

  # Document Scanner Sidecar
  # Validates request-type file attachments against the format criteria authored on
  # the request type's file parameter. Called by dataholder-backend at upload time.
  document-scanner:
    image: document-scanner:latest
    build:
      context: ./document-scanner
      dockerfile: Dockerfile
    container_name: document-scanner
    ports:
      - "127.0.0.1:9600:9600"
    environment:
      - DOCUMENT_SCANNER_SECRET=${DOCUMENT_SCANNER_SECRET:?DOCUMENT_SCANNER_SECRET must be set}
      - SCANNER_MAX_FILE_MB=${SCANNER_MAX_FILE_MB:-25}
      - SCANNER_MAX_OCR_PAGES=${SCANNER_MAX_OCR_PAGES:-10}
      - SCANNER_OCR_DPI=${SCANNER_OCR_DPI:-300}
      - SCANNER_WORKERS=${SCANNER_WORKERS:-2}
      # Mutual TLS — the whole sidecar port flips to client-auth TLS when enabled
      # Scanner-specific so it can run before its certs exist; flip on once minted.
      - MTLS_ENABLED=${SCANNER_MTLS_ENABLED:-false}
      - MTLS_CERT_FILE=/certs/document-scanner.crt
      - MTLS_KEY_FILE=/certs/document-scanner.key
      - MTLS_CA_FILE=/certs/document-scanner-truststore.crt
    volumes:
      - ./certs:/certs:ro
    networks:
      - app-network

  # React Frontend
  jaddar-frontend:
    image: jaddar-frontend:latest
    build:
      context: ./jaddar-frontend
      dockerfile: Dockerfile.dev
    container_name: jaddar-frontend
    ports:
      - "${JADDAR_FRONTEND_PORT:-3000}:3000"
    environment:
      # SSR (React Router v7 framework mode) — server-side config only.
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-change-me-please-32chars}
      - SESSION_IDLE_MINUTES=${SESSION_IDLE_MINUTES:-15}
      - SESSION_WARN_SECONDS=${SESSION_WARN_SECONDS:-120}
      - SESSION_MAX_HOURS=${SESSION_MAX_HOURS:-8}
      - SESSION_DB_HOST=postgres
      - SESSION_DB_PORT=5432
      - SESSION_DB_NAME=sessions_db
      - SESSION_DB_USER=${POSTGRES_USER}
      - SESSION_DB_PASSWORD=${POSTGRES_PASSWORD}
      - SESSION_DATABASE_CA=/certs/infra-ca.crt
      - SOURCE_CODE_URL=${SOURCE_CODE_URL:-}
      - BACKEND_API_URL=http://jaddar-backend:8000
      - DATAHOLDER_API_URL=http://dataholder-backend:8082
      - REACT_APP_KEYCLOAK_ADMIN_URL=${REACT_APP_KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      - REACT_APP_VERSION=${REACT_APP_VERSION:-1.0.8}
      - NODE_ENV=development
    volumes:
      - ./certs:/certs:ro
      - ./jaddar-frontend:/app
      - /app/node_modules
    depends_on:
      jaddar-backend:
        condition: service_started
      postgres-setup:
        condition: service_completed_successfully
    networks:
      - app-network
    stdin_open: true
    tty: true
  
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # TLS: stage the CA-signed server cert with correct perms before start
      - DB_SSL_CERT_NAME=postgres
      - DB_SSL_OWNER=postgres
    entrypoint: ["/usr/local/bin/db-ssl-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/db-certs/server.crt
      - -c
      - ssl_key_file=/etc/db-certs/server.key
      - -c
      - ssl_ca_file=/etc/db-certs/ca.crt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
      - ./scripts/db-ssl-entrypoint.sh:/usr/local/bin/db-ssl-entrypoint.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Data Holder Frontend
  dataholder-frontend:
    image: dataholder-frontend:latest
    build:
      context: ./dataholder-frontend
      dockerfile: Dockerfile.dev
    container_name: dataholder-frontend
    ports:
      - "3001:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-change-me-please-32chars}
      - SOURCE_CODE_URL=${SOURCE_CODE_URL:-}
      - BACKEND_API_URL=http://dataholder-backend:8082
      - NODE_ENV=development
      - REACT_APP_VERSION=1.0.8
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./dataholder-frontend:/app
      - /app/node_modules
    depends_on:
      - dataholder-backend
    networks:
      - app-network

  # Data Holder Backend
  dataholder-backend:
    image: dataholder-backend:latest
    build:
      context: ./dataholder-backend
      dockerfile: Dockerfile.dev
    container_name: dataholder-backend
    ports:
      - "8082:8082"
      - "8482:8482"  # mTLS listener (inter-service)
      - "5007:5007"  # Remote debug port
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dataholder_db?sslmode=verify-ca&sslrootcert=/certs/infra-ca.crt
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Sensitive introspection/token hop -> encrypted https:8443 (WebClient already trusts the dev CA).
      - KEYCLOAK_AUTH_SERVER_URL=https://keycloak:8443
      - KEYCLOAK_INTROSPECT_URL=http://keycloak:8080/realms/master/protocol/openid-connect/token/introspect
      - KEYCLOAK_CLIENT_ID=${JADDAR_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${JADDAR_CLIENT_SECRET}
      - DATAHOLDER_JWT_SECRET=${DATAHOLDER_JWT_SECRET:?DATAHOLDER_JWT_SECRET must be set}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - DATAHOLDER_NAME=Test Data Holder
      - DATAHOLDER_ID=TDH-001
      - DEFAULT_ACCESS_LEVEL=1
      - REQUIRE_AGREEMENT=true
      - MANUAL_VERIFICATION_ENABLED=false
      - MANUAL_VERIFICATION_LEVEL=3
      - DATAHOLDER_NOTIFICATION_MAIL_ENDPOINT=${DATAHOLDER_NOTIFICATION_MAIL_ENDPOINT}
      - DATAHOLDER_NOTIFICATION_ENABLED=${DATAHOLDER_NOTIFICATION_ENABLED:-true}
      - DATAHOLDER_NOTIFICATION_FROM_EMAIL=${DATAHOLDER_NOTIFICATION_FROM_EMAIL:-noreply@dataholder.local}
      - DATAHOLDER_NOTIFICATION_FROM_NAME=${DATAHOLDER_NOTIFICATION_FROM_NAME:-RDAP Data Holder}
      - ADMIN_USERNAME=${DATAHOLDER_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${DATAHOLDER_ADMIN_PASSWORD:?DATAHOLDER_ADMIN_PASSWORD must be set}
      # Password recovery (Twilio SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Data Holder Admin}
      - DATAHOLDER_FRONTEND_URL=${DATAHOLDER_FRONTEND_URL:-http://localhost:3001}
      - PASSWORD_RESET_EXPIRY_MINUTES=${PASSWORD_RESET_EXPIRY_MINUTES:-60}
      # Data Holder Group Admin connection
      - DH_GROUP_ADMIN_URL=http://dh-group-admin-backend:8083/dh-group-admin
      - DOCUMENT_SCANNER_URL=http://document-scanner:9600
      - DOCUMENT_SCANNER_SECRET=${DOCUMENT_SCANNER_SECRET:?DOCUMENT_SCANNER_SECRET must be set}
      - DATAHOLDER_FILE_UPLOAD_DIR=/app/uploads
      # Spring DevTools — hot reload when target/classes is recompiled
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Mutual TLS listener for inter-service calls (jaddar RDAP, DHG status callback); DH_GROUP_ADMIN_URL above (http) is rewritten onto DHG's mTLS listener at runtime.
      - MTLS_ENABLED=${MTLS_ENABLED:-true}
      - MTLS_PORT=8482
      - MTLS_KEY_STORE=/certs/dataholder-backend.p12
      - MTLS_KEY_STORE_PASSWORD=${MTLS_KEYSTORE_PASSWORD:-changeit}
      - MTLS_TRUST_STORE=/certs/dataholder-truststore.p12
      - MTLS_TRUST_STORE_PASSWORD=${MTLS_TRUSTSTORE_PASSWORD:-changeit}
    volumes:
      - dataholder_uploads:/app/uploads
      - ./dataholder-backend/src:/app/src
      - ./dataholder-backend/pom.xml:/app/pom.xml:ro
      - dataholder-target:/app/target
      - dataholder-maven-cache:/root/.m2
      - ./certs:/certs:ro
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      # Dev image (maven/temurin) has no curl; use a bash TCP probe instead
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8082' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # PostgreSQL Setup - Creates additional databases if they don't exist
  postgres-setup:
    image: postgres:15-alpine
    container_name: postgres-setup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    restart: "no"
    command: |
      sh -c '
      echo "===== CREATING DATABASES IF NEEDED =====" &&
      
      psql -h postgres -U $$POSTGRES_USER -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = '"'"'agreement_db'"'"'" | grep -q 1 || \
        psql -h postgres -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE agreement_db;" &&
      echo "✓ agreement_db ready" &&
      
      psql -h postgres -U $$POSTGRES_USER -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = '"'"'keycloak_db'"'"'" | grep -q 1 || \
        psql -h postgres -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE keycloak_db;" &&
      echo "✓ keycloak_db ready" &&

      psql -h postgres -U $$POSTGRES_USER -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = '"'"'dataholder_db'"'"'" | grep -q 1 || \
        psql -h postgres -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE dataholder_db;" &&
      echo "✓ dataholder_db ready" &&

      psql -h postgres -U $$POSTGRES_USER -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = '"'"'dhgroupadmin_db'"'"'" | grep -q 1 || \
        psql -h postgres -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE dhgroupadmin_db;" &&
      echo "✓ dhgroupadmin_db ready" &&
      
      psql -h postgres -U $$POSTGRES_USER -d postgres -tc \
        "SELECT 1 FROM pg_database WHERE datname = '"'"'sessions_db'"'"'" | grep -q 1 || \
        psql -h postgres -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE sessions_db;" &&
      echo "✓ sessions_db ready" &&
      
      echo "===== ALL DATABASES READY ====="
      '

volumes:
  dataholder_uploads:
  postgres_data:
  requestor-manager-maven-cache:
  dh-group-admin-maven-cache:
  dh-group-admin-target:
  dataholder-maven-cache:
  dataholder-target:
  jaddar-target:

networks:
  app-network:
    driver: bridge