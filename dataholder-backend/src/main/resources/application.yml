server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Mutual TLS between backend services (see scripts/generate-mtls-certs.sh).
# Disabled by default so a lone service can run without the cert chain (local dev).
mtls:
  enabled: ${MTLS_ENABLED:false}
  port: ${MTLS_PORT:8482}
  key-store: ${MTLS_KEY_STORE:}
  key-store-password: ${MTLS_KEY_STORE_PASSWORD:}
  trust-store: ${MTLS_TRUST_STORE:}
  trust-store-password: ${MTLS_TRUST_STORE_PASSWORD:}
  port-map: ${MTLS_PORT_MAP:8081:8481,8082:8482,8083:8483}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      
  application:
    name: dataholder-server
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dataholder_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

# Data Holder Configuration
dataholder:
  document-scanner:
    # Companion service that validates uploaded attachments against the format criteria
    # authored on a request type's file parameter. Fails open if unreachable.
    url: ${DOCUMENT_SCANNER_URL:http://document-scanner:9600}
    secret: ${DOCUMENT_SCANNER_SECRET:}
    enabled: ${DOCUMENT_SCANNER_ENABLED:true}
    timeout-seconds: ${DOCUMENT_SCANNER_TIMEOUT_SECONDS:120}
  name: ${DATAHOLDER_NAME:Test Data Holder}
  id: ${DATAHOLDER_ID:TDH-001}
  
  # Keycloak/JADDAR token introspection
  keycloak:
    introspect-url: ${KEYCLOAK_INTROSPECT_URL:http://keycloak:8080/realms/master/protocol/openid-connect/token/introspect}
    client-id: ${KEYCLOAK_CLIENT_ID:jaddar-app}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  
  # Access level policies (0=minimal, 3=full)
  policies:
    default-access-level: ${DEFAULT_ACCESS_LEVEL:1}
    require-agreement: ${REQUIRE_AGREEMENT:true}
    # Manual verification settings
    manual-verification:
      enabled: ${MANUAL_VERIFICATION_ENABLED:false}
      required-for-level: ${MANUAL_VERIFICATION_LEVEL:3}
    # Agreement-specific access levels
    agreement-levels:
      # Map of agreement ID -> access level
      # Will be loaded from database
  
  # Admin credentials for the data holder admin UI
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}

# SendGrid (Twilio) email — password recovery
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}
  from-name: ${SENDGRID_FROM_NAME:Data Holder Admin}

# Password recovery
app:
  frontend-url: ${DATAHOLDER_FRONTEND_URL:http://localhost:3001}
  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}

# Logging
logging:
  level:
    com.jaddar.dataholder: DEBUG
    org.springframework.security: DEBUG
