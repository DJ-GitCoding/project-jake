# Data Holder: {{ name }}
# Subdomain: {{ subdomain }}.{{ parent_domain }}
# Created: {{ created_at }}
# Managed by provisioning sidecar — do not edit manually

server {
    listen 80;
    server_name {{ subdomain }}.{{ parent_domain }};
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name {{ subdomain }}.{{ parent_domain }};

    ssl_certificate /etc/letsencrypt/live/{{ parent_domain }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ parent_domain }}/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Data Holder Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:{{ backend_port }}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Data Holder Frontend (default)
    location / {
        proxy_pass http://127.0.0.1:{{ frontend_port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
